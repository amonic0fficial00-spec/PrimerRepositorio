<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amonic - Elegancia con raíces</title>
    <!-- Favicon de la página -->
    <link rel="icon" type="image/png" href="Img/LOGO en barra.png">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Bootstrap Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="scroll-smooth">

    <!-- Barra de Navegación -->
    <header class="sticky-top bg-white shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-light py-3">
            <div class="container">
                <!-- Logo en la Barra de Nav -->
                <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
                    <img src="Img/LOGO en barra.png" alt="Amonic Logo" width="45" height="45" class="d-inline-block object-fit-contain">
                    <div class="d-flex flex-column align-items-start">
                        <span class="brand-title lh-1">Ámonic</span>
                        <span class="brand-subtitle">Elegancia con raíces</span>
                    </div>
                </a>

                <!-- Botón hamburguesa -->
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAmonic" aria-controls="navbarAmonic" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú de navegación y Carrito -->
                <div class="collapse navbar-collapse justify-content-end" id="navbarAmonic">
                    <ul class="navbar-nav gap-lg-4 text-center align-items-center">
                        <li class="nav-item">
                            <a class="nav-link custom-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link custom-link" href="Nosotros.html">Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link custom-link" href="Tienda.html">Tienda</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link custom-link" href="Contacto.html">Contacto</a>
                        </li>
                        <!-- Carrito de compras -->
                        <li class="nav-item mt-2 mt-lg-0">
                            <a class="nav-link custom-link position-relative px-2 active" href="Carrito de Compras.html" aria-label="Carrito de compras">
                                <i class="bi bi-bag fs-5 carrito-icon"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido del Carrito -->
    <main class="container my-5">
        <h2 class="mb-4 text-center fw-normal font-serif">Tu Carrito de Compras</h2>
        
        <div class="row g-4">
            <!-- Tabla de productos -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-3">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="cart-items">
                                <!-- Los productos se inyectarán aquí automáticamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Resumen de compra -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4">
                    <h4 class="mb-3 font-serif">Resumen del pedido</h4>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal</span>
                        <span id="cartSubtotal" class="fw-bold">$ 0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                        <span class="text-muted">Envío</span>
                        <span class="text-muted">Calculado al finalizar</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">Total</span>
                        <span id="cartTotal" class="fs-5 fw-bold text-dark">$ 0</span>
                    </div>
                    <button class="btn btn-dark w-100 py-3 text-uppercase rounded-0 fw-semibold" onclick="alert('¡Compra simulada con éxito!')">Proceder al pago</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 bg-dark text-white mt-5">
        <p class="mb-0 fs-6 fw-bold">© 2026 Ámonic Elegancia con raíces.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- Script para cargar el carrito -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const cartContainer = document.getElementById("cart-items");
            const cartCountBadge = document.getElementById("cartCount");
            const cartSubtotalEl = document.getElementById("cartSubtotal");
            const cartTotalEl = document.getElementById("cartTotal");

            let cart = JSON.parse(localStorage.getItem("amonicCart")) || [];

            let totalItems = cart.reduce((sum, item) => sum + parseInt(item.quantity || 0), 0);
            if (cartCountBadge) cartCountBadge.textContent = totalItems;

            if (cartContainer) {
                if (cart.length === 0) {
                    cartContainer.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">Tu carrito está vacío. <a href="Tienda.html" class="text-dark fw-bold">Ir a la tienda</a></td></tr>`;
                    if (cartSubtotalEl) cartSubtotalEl.textContent = "$ 0";
                    if (cartTotalEl) cartTotalEl.textContent = "$ 0";
                    return;
                }

                let html = "";
                let subtotalGral = 0;

                cart.forEach((item, index) => {
                    let price = parseFloat(item.price) || 0;
                    let quantity = parseInt(item.quantity) || 0;
                    let subtotal = price * quantity;
                    subtotalGral += subtotal;

                    html += `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center gap-3">
                                    <img src="${item.image}" alt="${item.name}" style="width: 70px; height: 70px; object-fit: cover;" class="rounded border">
                                    <div>
                                        <h6 class="mb-1">${item.name}</h6>
                                        <small class="text-muted">Talla: <strong>${item.size || 'Única'}</strong> | Color: <strong>${item.color || 'Estándar'}</strong></small>
                                    </div>
                                </div>
                            </td>
                            <td>$ ${price.toLocaleString()}</td>
                            <td>${quantity}</td>
                            <td class="fw-bold">$ ${subtotal.toLocaleString()}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger border-0" onclick="removeItem(${index})" title="Eliminar producto">
                                    <i class="bi bi-trash fs-5"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });

                cartContainer.innerHTML = html;
                if (cartSubtotalEl) cartSubtotalEl.textContent = `$ ${subtotalGral.toLocaleString()}`;
                if (cartTotalEl) cartTotalEl.textContent = `$ ${subtotalGral.toLocaleString()}`;
            }
        });

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem("amonicCart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("amonicCart", JSON.stringify(cart));
            location.reload();
        }
    </script>
</body>
</html>
